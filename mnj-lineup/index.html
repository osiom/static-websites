<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, height=720" />
  <title>MNJ 2026 — Lineup</title>
  <link rel="preload" href="assets/fonts/ScribbleWire.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="scene">
    <div class="scene__star" aria-hidden="true">
      <img class="scene__star-img" src="assets/monster2.svg" alt="" />
    </div>

    <div class="lineup">
      <ul class="lineup__list" id="lineupList"></ul>
    </div>

    <div class="scene__monster" aria-hidden="true">
      <img class="scene__monster-img" src="assets/monster1.svg" alt="" />
    </div>

    <div class="crt" aria-hidden="true"></div>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
